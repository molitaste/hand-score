name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir proj && unzip -q HandScore-Android-Project.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: cd proj && gradle assembleRelease --no-daemon
      - run: cp proj/app/build/outputs/apk/release/app-release.apk HandScore.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HandScore-APK
          path: HandScore.apk
